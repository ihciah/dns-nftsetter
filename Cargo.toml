[package]
name = "dns-nftsetter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.6.1", features = ["derive"] }
pcap = "2.4.0"
etherparse = "0.20.1"
dns-parser = "0.8.0"
libc = "0.2.186"
hashlink = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
